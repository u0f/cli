name: Sync upstream

# Once a day, if spicetify/cli has commits that this fork lacks, open a pull request
# from spicetify:main into main so they can be reviewed before merging.
# Nothing is merged automatically. If GitHub refuses the pull request (for example
# because "Allow GitHub Actions to create and approve pull requests" is off), an issue
# with the comparison link and the error is opened instead.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sync-upstream.yml]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Open a pull request with new upstream commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ahead=$(gh api "repos/$REPO/compare/main...spicetify:main" --jq .ahead_by)
          if [ "$ahead" = "0" ]; then
            echo "Up to date with spicetify/cli."
            exit 0
          fi

          # A pull request from spicetify:main follows that branch, so an open one already has every new commit.
          open=$(gh api "repos/$REPO/pulls?state=open&base=main&per_page=100" \
            --jq '[.[] | select(.head.repo.full_name == "spicetify/cli" and .head.ref == "main")] | length')
          if [ "$open" != "0" ]; then
            echo "A sync pull request is already open."
            exit 0
          fi

          compare="https://github.com/$REPO/compare/main...spicetify:main"
          body="spicetify/cli has $ahead new commit(s): $compare

          Before merging:
          - [ ] Resolve conflicts. Files this fork deleted (update.go, install scripts, reddit, new-releases, upstream workflows...) must stay deleted: \`git rm\` them.
          - [ ] Check no new remote calls came back: \`git diff HEAD~1 -- src | grep -E '^\+.*https?://'\`.
          - [ ] Rebuild (\`pnpm build:wrapper\`, \`go build\`) and run \`spicetify backup apply\`."

          # maintainer_can_modify must be false: it would need write access to spicetify/cli.
          if gh api "repos/$REPO/pulls" -f head="spicetify:main" -f base=main -F maintainer_can_modify=false \
            -f title="Sync with spicetify/cli" -f body="$body" > pr.json 2>err.txt; then
            echo "Opened $(jq -r .html_url pr.json)"
            exit 0
          fi

          # gh prints only the status line on stderr; the reason is in the response body.
          error="$(cat err.txt) $(jq -c '{message, errors}' pr.json 2>/dev/null)"
          echo "::warning::Could not open the pull request: $error"
          title="spicetify/cli has new commits to sync"
          existing=$(gh api "repos/$REPO/issues?state=open&per_page=100" --jq "[.[] | select(.title == \"$title\" and (.pull_request | not))] | length" 2>/dev/null) || existing=0
          if [ "$existing" = "0" ]; then
            gh api "repos/$REPO/issues" -f title="$title" -f body="$body

          The pull request could not be opened automatically:
          \`\`\`
          $error
          \`\`\`
          If it says GitHub Actions is not permitted to create pull requests, enable *Settings → Actions → General → Allow GitHub Actions to create and approve pull requests*, or open it by hand from the link above." --jq .html_url 2>issue-err.txt \
              || { echo "::error::Could not open an issue either (are issues enabled?): $(cat issue-err.txt)"; exit 1; }
          fi
