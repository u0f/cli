name: Release

# Pushing a tag like v2.46.2-fork.1 builds every platform and publishes a GitHub release
# with the archives and a SHA256SUMS file to verify them.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:wrapper

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          mkdir dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            exe="spicetify"
            [ "$os" = "windows" ] && exe="spicetify.exe"
            stage="stage/$os-$arch"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$stage/$exe" .
            cp -r CustomApps Extensions Themes jsHelper globals.d.ts css-map.json LICENSE README.md "$stage/"
            name="spicetify-$version-$os-$arch"
            if [ "$os" = "windows" ]; then
              (cd "$stage" && zip -qr "../../dist/$name.zip" .)
            else
              tar -czf "dist/$name.tar.gz" -C "$stage" .
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "${{ github.repository }}" --title "$TAG" --generate-notes --latest
