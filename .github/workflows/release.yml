name: Release

# Pushing a tag like v2.46.2-fork.1 builds every platform and publishes a GitHub release
# with the archives and a SHA256SUMS file to verify them.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:wrapper

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          mkdir dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            exe="spicetify"
            [ "$os" = "windows" ] && exe="spicetify.exe"
            stage="stage/$os-$arch"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$stage/$exe" .
            cp -r CustomApps Extensions Themes jsHelper globals.d.ts css-map.json LICENSE README.md "$stage/"
            name="spicetify-$version-$os-$arch"
            if [ "$os" = "windows" ]; then
              (cd "$stage" && zip -qr "../../dist/$name.zip" .)
            else
              tar -czf "dist/$name.tar.gz" -C "$stage" .
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)

      # spicetify update only installs a release whose SHA256SUMS carries this signature.
      - name: Sign SHA256SUMS
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::The UPDATE_SIGNING_KEY secret is missing; releases must be signed."
            exit 1
          fi
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          public=$(openssl pkey -in "$RUNNER_TEMP/key.pem" -pubout -outform DER | tail -c 32 | base64 -w0)
          if ! grep -q "updatePublicKey *= \"$public\"" src/cmd/update.go; then
            rm -f "$RUNNER_TEMP/key.pem"
            echo "::error::UPDATE_SIGNING_KEY does not match updatePublicKey in src/cmd/update.go."
            exit 1
          fi
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/key.pem" -in dist/SHA256SUMS | base64 -w0 > dist/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/key.pem"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "${{ github.repository }}" --title "$TAG" --generate-notes --latest
